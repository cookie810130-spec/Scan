name: Android CI Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 使用固定版本 Gradle，不再使用 Runner 內建的 Gradle 9.8
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.6"

      - name: Build with Gradle
        run: gradle :app:assembleDebug --stacktrace
      - name: Run ZXing DataBar test
        run: gradle :app:testDebugUnitTest --tests com.store.inventoryscanner.ZxingDataBarImageTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
